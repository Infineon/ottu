[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ottu"
dynamic = ["version"]
description = "CLI tool for embedded on-target testing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Infineon Technologies AG", email = "maker@infineon.com"}
]
keywords = ["embedded", "testing", "cli", "on-target"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "codespell>=2.4.3",
]

[project.scripts]
ottu = "ottu.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "codespell>=2.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ottu --cov-report=xml --cov-report=term-missing"

[tool.ruff]
src = ["ottu", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["ottu"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "ottu/_version.py"

[tool.codespell]
quiet-level = 3
skip = ".git,__pycache__,.pytest_cache,.ruff_cache,.mypy_cache,node_modules,.venv"