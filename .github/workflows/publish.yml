name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ottu/

    steps:
    - uses: actions/checkout@v7
 
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Format check
      run: uv run ruff format --check

    - name: Lint
      run: uv run ruff check

    - name: Type check
      run: uv run mypy

    - name: Run tests
      run: uv run pytest

    - name: Build distribution
      run: uv build

    - name: Publish to PyPI
      run: uv publish
