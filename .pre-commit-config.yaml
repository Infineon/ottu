repos:
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: npx --yes @commitlint/cli --config commitlint.config.js --edit
        language: system
        stages: [commit-msg]
        pass_filenames: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

